[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-miniature-timelapse"
version = "0.1.0"
description = "AI Miniature Timelapse Pipeline - Vehicle Assembly with Reference-Frame Relay v2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "PTH", "TRY", "T20", "TCH", "ICN", "PIE", "RET", "ARG", "FLY", "PD", "T10"]
lint.ignore = ["E501", "T201"]
fixable = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "PTH", "TRY", "TCH", "ICN", "PIE", "RET", "ARG", "FLY", "PD", "T10"]
format.quote-style = "double"
format.indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
strict = false